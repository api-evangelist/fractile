aid: fractile
name: Fractile
description: >-
  Fractile is a UK-based semiconductor startup, founded in 2022 and headquartered
  in London with an engineering base in Bristol, designing a new class of AI
  inference processors. Its architecture physically interleaves memory and compute
  to overcome the memory-bandwidth bottleneck that limits large language model
  inference, targeting frontier model serving up to 25x faster and at roughly
  1/10th the cost of existing hardware. The company takes a full-stack approach
  spanning transistor-level circuit design through cloud inference server logic,
  and in May 2026 raised $220M to build the next generation of inference hardware.
  Backers include Accel and Felicis. Led by founder and CEO Walter Goodwin,
  Fractile is a hardware/compute company and does not currently publish a public
  developer API, SDK, or developer portal.
